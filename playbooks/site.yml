---
- name: Run pve configuration
  hosts:
    - torterra.local.carnivuth.org
  roles:
    - roles/cronjobs
    - roles/graphite_exporter
- name: Run global site configuration
  hosts:
    - torterra.local.carnivuth.org
  roles:
    - roles/align_cloudflare_dns
    - roles/enforce_policies
    - roles/Ts_script
    - roles/ban_krawl_ips
- name: align all services in docker hosts
  hosts:
    - torterra.local.carnivuth.org
  roles:
    - role: geerlingguy.docker
      vars:
        docker_install_compose_plugin: false
        docker_compose_package: docker-compose-plugin
        docker_compose_package_state: present
    - roles/align_services
