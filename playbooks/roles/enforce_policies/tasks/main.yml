---
- name: Download vimrcfile
  become: true
  ansible.builtin.get_url:
    url: https://github.com/carnivuth/toolbox/releases/download/vimrc-v{{ enforce_policies_toolbox_vimrc_version }}/vimrc
    dest: ~/.vimrc
    mode: '644'

- name: Set timezone
  become: true
  community.general.timezone:
    name: "{{ enforce_policies_timezone }}"

- name: Configure ssh daemon
  become: true
  ansible.builtin.copy:
    src: sshd_config
    dest: "/etc/ssh/sshd_config"
    mode: "0600"
    owner: root
  notify: Restart sshd

- name: Add TELEGRAM_CHAT_ID env var
  become: true
  ansible.builtin.cron:
    env: true
    name: "TELEGRAM_CHAT_ID"
    value: "{{ vault_telegram_chat_id }}"

- name: Add TELEGRAM_TOKEN env var
  become: true
  ansible.builtin.cron:
    env: true
    name: "TELEGRAM_TOKEN"
    value: "{{ vault_telegram_token }}"

- name: Add TELEGRAM_CHAT_ID in bashrc
  become: true
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    state: present
    line: "export TELEGRAM_CHAT_ID={{ vault_telegram_chat_id }}"

- name: Add TELEGRAM_TOKEN in bashrc
  become: true
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    state: present
    line: "export TELEGRAM_TOKEN={{ vault_telegram_token }}"
